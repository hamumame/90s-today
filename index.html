<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1:1 カメラ録画</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #111; color: #fff;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 14px;
  }
  .stage {
    position: relative; width: min(92vw, 68vh); aspect-ratio: 1 / 1;
    border-radius: 16px; overflow: hidden; background: #000;
  }
  .stage canvas, .stage video { width: 100%; height: 100%; display: block; object-fit: cover; }
  #playback { display: none; }
  .badge {
    position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.55); font-size: 14px; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  .rec .dot { background: #ff3b30; animation: blink 1s infinite; }
  .paused .dot { background: #ffcc00; }
  @keyframes blink { 50% { opacity: .2; } }
  .remain {
    position: absolute; top: 10px; right: 10px; padding: 4px 12px; border-radius: 999px;
    background: rgba(0,0,0,.55); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .remain.low { background: rgba(255,59,48,.85); }
  .flip {
    position: absolute; right: 10px; bottom: 16px; width: 52px; height: 52px; min-width: 0;
    padding: 0; border-radius: 50%; background: rgba(0,0,0,.55); font-size: 24px;
  }
  .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: #ff3b30; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    border: none; border-radius: 999px; padding: 14px 22px; font-size: 16px; font-weight: 600;
    background: #2c2c2e; color: #fff; min-width: 96px;
  }
  button.primary { background: #ff3b30; }
  button.save { background: #0a84ff; }
  button:disabled { opacity: .35; }
  .hidden { display: none !important; }
  #msg { font-size: 13px; color: #aaa; text-align: center; min-height: 1em; max-width: 92vw; }
</style>
</head>
<body>

<div class="stage">
  <canvas id="canvas" width="720" height="720"></canvas>
  <video id="playback" playsinline controls></video>
  <div class="badge" id="badge"><span class="dot"></span><span id="time">0:00</span></div>
  <div class="remain" id="remain">残り 1:30</div>
  <button class="flip" id="btnSwitch" title="カメラ切替">↺</button>
  <div class="bar" id="bar"></div>
</div>

<div class="controls">
  <button id="btnStart" class="primary">● 録画開始</button>
  <button id="btnPause" class="hidden">❚❚ 一時停止</button>
  <button id="btnStop" class="hidden">■ 終了</button>
  <button id="btnShare" class="save hidden">写真に保存／共有</button>
  <button id="btnSave" class="save hidden">ダウンロード</button>
  <button id="btnRetake" class="hidden">撮り直す</button>
</div>
<div id="msg"></div>

<!-- カメラの生映像（非表示。canvasで正方形に切り抜いて表示・録画します） -->
<video id="cam" playsinline muted autoplay style="display:none"></video>

<script>
const MAX_MS = 90 * 1000; // 最大録画時間 1:30

const cam = document.getElementById('cam');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const playback = document.getElementById('playback');
const $ = id => document.getElementById(id);

let videoStream = null;     // カメラ（切り替えるたびに差し替え）
let audioStream = null;     // マイク（録画中ずっと同じものを使う）
let facing = 'user';        // 'user'=インカメラ / 'environment'=背面
let drawMirror = true;      // 実際に表示中の映像を鏡写しにするか
let switching = false;
let recorder = null;
let chunks = [];
let state = 'idle';         // idle | recording | paused | done
let elapsed = 0;            // 実際に録画した時間（停止中は加算しない）
let lastTick = 0;
let videoBlob = null;
let blobUrl = null;
let fileExt = 'webm';

// ---------- マイク ----------
async function startMic() {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    audioStream = null;
    $('msg').textContent = 'マイクが使えないため、音声なしで録画します。';
  }
}

// ---------- カメラ（録画中でも差し替え可能） ----------
async function startCamera() {
  switching = true;
  $('btnSwitch').disabled = true;
  // iPhoneは2台同時に開けないことがあるので、先に今のカメラを止める
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    cam.srcObject = videoStream;
    await cam.play();
    drawMirror = (facing === 'user');
  } catch (e) {
    $('msg').textContent = 'カメラを起動できませんでした：' + e.message + '（HTTPSで開いているか、許可を確認してください）';
  }
  switching = false;
  $('btnSwitch').disabled = false;
}

function switchCamera() {
  if (switching || state === 'done') return;
  facing = facing === 'user' ? 'environment' : 'user';
  startCamera();
}

// ---------- 描画ループ：中央を正方形に切り抜き ----------
function draw(now) {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  // 切り替え中は最後のコマが残るので、録画が途切れません
  if (!switching && vw && vh) {
    const s = Math.min(vw, vh);
    const sx = (vw - s) / 2, sy = (vh - s) / 2;
    ctx.save();
    if (drawMirror) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(cam, sx, sy, s, s, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  // 録画中だけ時間を進める
  if (state === 'recording') {
    elapsed += now - lastTick;
    if (elapsed >= MAX_MS) { elapsed = MAX_MS; stopRecording(); }
  }
  lastTick = now;
  updateTimer();
  requestAnimationFrame(draw);
}

function fmt(ms) {
  const sec = Math.floor(ms / 1000);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function updateTimer() {
  const remain = MAX_MS - elapsed;
  $('time').textContent = fmt(elapsed);
  $('remain').textContent = '残り ' + fmt(Math.ceil(remain / 1000) * 1000);
  $('remain').classList.toggle('low', remain <= 10000 && state !== 'idle');
  $('bar').style.width = (elapsed / MAX_MS * 100) + '%';
}

// ---------- 録画 ----------
function pickMime() {
  const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

function startRecording() {
  if (!videoStream) return;
  const out = canvas.captureStream(30);
  if (audioStream) audioStream.getAudioTracks().forEach(t => out.addTrack(t));

  const mime = pickMime();
  fileExt = mime.includes('mp4') ? 'mp4' : 'webm';
  recorder = new MediaRecorder(out, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = showResult;
  recorder.start(1000);

  elapsed = 0;
  lastTick = performance.now();
  $('msg').textContent = '';
  setState('recording');
}

function togglePause() {
  if (state === 'recording') {
    recorder.pause();
    setState('paused');
  } else if (state === 'paused') {
    recorder.resume();
    lastTick = performance.now(); // 停止していた時間は数えない
    setState('recording');
  }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  setState('done');
}

function showResult() {
  const type = (recorder.mimeType || 'video/webm').split(';')[0];
  videoBlob = new Blob(chunks, { type });
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(videoBlob);
  playback.src = blobUrl;
  playback.style.display = 'block';
  canvas.style.display = 'none';

  // 共有シートに動画を渡せる端末（主にスマホ）だけ「写真に保存／共有」を出す
  const file = makeFile();
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  $('btnShare').classList.toggle('hidden', !canShare);
}

function makeFile() {
  const name = 'video_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + fileExt;
  return new File([videoBlob], name, { type: videoBlob.type });
}

// iPhone：共有シート →「ビデオを保存」で写真アプリへ / Android：ギャラリーやアプリへ
async function share() {
  try {
    await navigator.share({ files: [makeFile()] });
  } catch (e) {
    if (e.name !== 'AbortError') { $('msg').textContent = '共有できなかったので、ダウンロードします。'; download(); }
  }
}

// ファイルとして保存（PCや、共有に対応していないブラウザ向け）
function download() {
  const file = makeFile();
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function retake() {
  playback.pause();
  playback.style.display = 'none';
  canvas.style.display = 'block';
  elapsed = 0;
  $('msg').textContent = '';
  setState('idle');
}

// ---------- 画面の状態切替 ----------
function setState(s) {
  state = s;
  const badge = $('badge');
  badge.classList.toggle('rec', s === 'recording');
  badge.classList.toggle('paused', s === 'paused');

  const active = (s === 'recording' || s === 'paused');
  $('btnStart').classList.toggle('hidden', s !== 'idle');
  $('btnSwitch').classList.toggle('hidden', s === 'done'); // 録画中も切替できる
  $('btnPause').classList.toggle('hidden', !active);
  $('btnStop').classList.toggle('hidden', !active);
  $('btnSave').classList.toggle('hidden', s !== 'done');
  $('btnRetake').classList.toggle('hidden', s !== 'done');
  if (s !== 'done') $('btnShare').classList.add('hidden');
  $('btnPause').textContent = s === 'paused' ? '● 再開' : '❚❚ 一時停止';
}

$('btnStart').onclick = startRecording;
$('btnPause').onclick = togglePause;
$('btnStop').onclick = stopRecording;
$('btnShare').onclick = share;
$('btnSave').onclick = download;
$('btnRetake').onclick = retake;
$('btnSwitch').onclick = switchCamera;

(async () => {
  await startMic();
  await startCamera();
})();
requestAnimationFrame(t => { lastTick = t; draw(t); });
</script>
</body>
</html>
