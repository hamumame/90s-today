<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>1:1 カメラ録画</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    --size: min(calc(100vw - 16px), calc(100vh - 214px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    margin: 0; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
    gap: 8px; user-select: none; -webkit-user-select: none;
  }
  @supports (height: 100dvh) {
    body { --size: min(calc(100vw - 16px), calc(100dvh - 214px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); }
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:disabled { opacity: .35; }
  svg { display: block; }
  .hidden { display: none !important; }
  .invisible { visibility: hidden; }

  /* ---------- 上のバー ---------- */
  .topbar {
    width: var(--size); height: 56px; flex: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .tb-left { justify-self: start; display: flex; gap: 8px; }
  .tb-right { justify-self: end; }
  .chip {
    height: 40px; padding: 0 14px; border-radius: 999px; background: #1c1c1e;
    display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;
  }
  .chip.stop { background: #2c2c2e; }
  .chip.stop .sq { width: 12px; height: 12px; border-radius: 2px; background: #ff3b30; }
  .mic { padding: 0 12px; }
  .mic .lvl { width: 26px; height: 6px; border-radius: 3px; background: #3a3a3c; overflow: hidden; }
  .mic .lvl i { display: block; height: 100%; width: 0; background: #30d158; transition: width .08s; }
  .mic.off { background: #3a1513; color: #ff6b61; }
  .mic.off .lvl { display: none; }

  .timer { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .clock {
    display: flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 8px;
    font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em;
  }
  .rec .clock { background: #ff3b30; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }
  .rec .dot { background: #fff; animation: blink 1s infinite; }
  .paused .dot { background: #ffd60a; }
  @keyframes blink { 50% { opacity: .25; } }
  .remain { margin-top: 3px; font-size: 12px; color: #aeaeb2; font-variant-numeric: tabular-nums; }
  .remain.low { color: #ff6b61; font-weight: 700; }

  /* ---------- カメラ枠 ---------- */
  .stage {
    position: relative; width: var(--size); height: var(--size); flex: none;
    border-radius: 6px; overflow: hidden; background: #111; touch-action: none;
  }
  .stage canvas, .stage video { width: 100%; height: 100%; display: block; object-fit: cover; }
  #playback { display: none; background: #000; }
  .progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #ff3b30; }
  .notice {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    background: rgba(0,0,0,.65); padding: 8px 14px; border-radius: 10px; font-size: 13px;
    text-align: center; width: max-content; max-width: 90%;
  }
  .zoom {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .zoom button { width: 40px; height: 40px; border-radius: 50%; font-size: 22px; font-weight: 500; }
  .zoom #zoomLabel {
    width: 54px; font-size: 14px; font-weight: 700; color: #ffd60a; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.1); border-radius: 999px;
  }
  .busy {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(0,0,0,.6); font-size: 16px; font-weight: 600;
  }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 下のバー：シャッター ---------- */
  .bottombar {
    width: var(--size); height: 118px; flex: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .bb-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bb-right { justify-self: end; padding-right: 6px; }
  .shutter {
    width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff;
    display: grid; place-items: center; padding: 0;
  }
  .shutter .core {
    width: 62px; height: 62px; border-radius: 50%; background: #ff3b30;
    transition: width .2s, height .2s, border-radius .2s;
  }
  .shutter[data-s=recording] .core { width: 30px; height: 30px; border-radius: 7px; }
  .shutter[data-s=paused] { border-color: #ffd60a; }
  .shutter:active .core { transform: scale(.92); }
  .hint { font-size: 12px; color: #aeaeb2; height: 14px; }
  .round {
    width: 50px; height: 50px; border-radius: 50%; background: #1c1c1e;
    display: grid; place-items: center;
  }

  .done-row {
    width: var(--size); height: 118px; flex: none;
    display: flex; gap: 10px; align-items: center; justify-content: center;
  }
  .big {
    height: 52px; padding: 0 22px; border-radius: 999px; font-size: 16px; font-weight: 700;
    background: #2c2c2e; display: flex; align-items: center; gap: 8px;
  }
  .big.primary { background: #0a84ff; }
  #msg { font-size: 12px; color: #8e8e93; text-align: center; min-height: 1em; max-width: 92vw; }

  /* ---------- 終了確認 ---------- */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center;
    padding: 16px 12px calc(12px + env(safe-area-inset-bottom)); z-index: 10;
  }
  .sheet { width: min(420px, 100%); background: #1c1c1e; border-radius: 18px; padding: 22px 18px 18px; text-align: center; }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; }
  .sheet p { margin: 0 0 18px; color: #aeaeb2; font-size: 14px; }
  .sheet .row { display: flex; gap: 10px; }
  .sheet .row button { flex: 1; justify-content: center; }
  .big.danger { background: #ff3b30; }
</style>
</head>
<body>

<!-- 上：撮り直す・マイク / 時間 / 終了 -->
<div class="topbar">
  <div class="tb-left">
    <button class="chip hidden" id="btnRetake">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      撮り直す
    </button>
    <button class="chip mic" id="micBtn" aria-label="マイク">
      <svg width="16" height="18" viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4.5" y="1" width="7" height="11" rx="3.5"/><path d="M1.5 9a6.5 6.5 0 0 0 13 0M8 15.5V19"/><path id="micSlash" class="hidden" d="M1 1l14 18" stroke-width="2.2"/></svg>
      <span class="lvl"><i id="micLevel"></i></span>
      <span id="micText" class="hidden">オンにする</span>
    </button>
  </div>
  <div class="timer" id="badge">
    <div class="clock"><span class="dot"></span><span id="time">0:00</span></div>
    <div class="remain" id="remain">残り 1:30</div>
  </div>
  <div class="tb-right">
    <button class="chip stop invisible" id="btnStop"><span class="sq"></span>終了</button>
  </div>
</div>

<!-- カメラ -->
<div class="stage" id="stage">
  <canvas id="canvas" width="720" height="720"></canvas>
  <video id="playback" playsinline controls></video>
  <div class="notice hidden" id="notice"></div>
  <div class="zoom" id="zoomBox">
    <button id="zoomOut" aria-label="ズームアウト">−</button>
    <button id="zoomLabel" aria-label="等倍に戻す">1.0x</button>
    <button id="zoomIn" aria-label="ズーム">＋</button>
  </div>
  <div class="busy hidden" id="busy"><div class="spinner"></div><div id="busyText">動画を仕上げています…</div><div id="busyPct"></div></div>
  <div class="progress" id="progress"></div>
</div>

<!-- 下：シャッター（録画・一時停止・再開）とカメラ切替 -->
<div class="bottombar" id="controls">
  <div></div>
  <div class="bb-center">
    <button class="shutter" id="shutter" data-s="idle" aria-label="録画" disabled><span class="core"></span></button>
    <div class="hint" id="hint">準備中…</div>
  </div>
  <div class="bb-right">
    <button class="round" id="btnSwitch" aria-label="カメラ切替">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>
    </button>
  </div>
</div>
<div class="done-row hidden" id="doneRow">
  <button class="big primary hidden" id="btnShare">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    写真に保存／共有
  </button>
  <button class="big" id="btnSave">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    ダウンロード
  </button>
</div>
<div id="msg"></div>

<div class="sheet-bg hidden" id="sheet">
  <div class="sheet">
    <h2 id="sheetTitle">録画を終了しますか？</h2>
    <p id="sheetText">終了すると動画が完成し、続きは撮れなくなります。</p>
    <div class="row">
      <button class="big" id="btnBack">撮影に戻る</button>
      <button class="big danger" id="btnConfirm">終了する</button>
    </div>
  </div>
</div>

<!-- カメラの生映像（非表示） -->
<video id="cam" playsinline muted autoplay style="display:none"></video>

<script>
{
// ================= 設定 =================
const MAX_MS = 90 * 1000;   // 最大録画時間 1:30
const OUT = 240;            // 書き出しサイズ 240×240（1:1の240p）
const FPS = 25;             // 書き出しフレームレート
const FRAME_US = 1e6 / FPS;
const V_BITRATE = 500_000;
const A_BITRATE = 96_000;
const ZOOM_MIN = 1, ZOOM_MAX = 5;

const $ = id => document.getElementById(id);
const cam = $('cam'), canvas = $('canvas'), ctx = canvas.getContext('2d'), playback = $('playback');
// 録画用の小さいキャンバス（240×240）。画面表示は大きいキャンバスで綺麗に
const recCanvas = document.createElement('canvas');
recCanvas.width = recCanvas.height = OUT;
const rctx = recCanvas.getContext('2d');

let videoStream = null, audioStream = null;
let audioCtx = null, capNode = null, micSrc = null, analyser = null, sink = null;
let facing = 'environment', drawMirror = false, switching = false;
let zoom = 1;
let state = 'idle';         // idle | recording | paused | finishing | done
let elapsed = 0, lastTick = 0;
let resumeAfterBack = false;
let pending = [];
let videoBlob = null, blobUrl = null, fileExt = 'mp4';
let engine = 'mr';          // 'wc' = 高速（WebCodecs） / 'mr' = 互換（MediaRecorder）
let ready = false;

// ================= 端末内保存（IndexedDB） =================
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('square-recorder', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (d.objectStoreNames.contains('chunks')) d.deleteObjectStore('chunks');
      if (d.objectStoreNames.contains('meta')) d.deleteObjectStore('meta');
      d.createObjectStore('chunks', { autoIncrement: true });
      d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (name, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(name, mode);
      const req = fn(t.objectStore(name));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    add: v => tx('chunks', 'readwrite', s => s.add(v)),
    all: () => tx('chunks', 'readonly', s => s.getAll()),
    set: (k, v) => tx('meta', 'readwrite', s => s.put(v, k)),
    get: k => tx('meta', 'readonly', s => s.get(k)),
    clear: () => Promise.all([tx('chunks', 'readwrite', s => s.clear()), tx('meta', 'readwrite', s => s.clear())])
  };
})();
const keep = p => pending.push(Promise.resolve(p).catch(() => {}));
// 書き込み待ちを、途中で増えた分も含めてすべて待つ
async function drain() { while (pending.length) { const p = pending; pending = []; await Promise.all(p); } }

// ================= 高速エンジン（WebCodecs + MP4） =================
// フレームに「録画した時間」でタイムスタンプを付けて直接エンコード。
// 一時停止や開き直しがあっても、終了時はデータを並べて包むだけなので一瞬で完成します。
const WC = {
  vCodec: null, aCodec: 'aac', vEnc: null, aEnc: null, vcfg: null, acfg: null,
  v: [], a: [], frameIndex: 0, nextFrameUs: 0, needKey: true,
  audioBaseUs: 0, audioSamples: 0, lastAudioEndUs: 0,

  async supported() {
    try {
      if (!window.VideoEncoder || !window.VideoFrame) return false;
      for (const codec of ['avc1.42001f', 'avc1.4d001f', 'avc1.64001f']) {
        const r = await VideoEncoder.isConfigSupported(this.vConfig(codec));
        if (r.supported) { this.vCodec = codec; break; }
      }
      if (!this.vCodec) return false;
      if (audioStream) {
        if (!window.AudioEncoder || !window.AudioData || !capNode) return false;
        // AAC を優先。使えない端末では Opus
        this.aCodec = null;
        for (const c of ['aac', 'opus']) {
          if (c === 'opus' && audioCtx.sampleRate !== 48000) continue;
          const r = await AudioEncoder.isConfigSupported(this.aConfig(c));
          if (r.supported) { this.aCodec = c; break; }
        }
        if (!this.aCodec) return false;
      }
      return true;
    } catch (e) { return false; }
  },
  vConfig(codec) {
    return { codec, width: OUT, height: OUT, bitrate: V_BITRATE, framerate: FPS, avc: { format: 'avc' } };
  },
  aConfig(c = this.aCodec) {
    return c === 'opus'
      ? { codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: A_BITRATE }
      : { codec: 'mp4a.40.2', sampleRate: audioCtx.sampleRate, numberOfChannels: 1, bitrate: A_BITRATE, aac: { format: 'aac' } };
  },
  ensureEncoders() {
    if (!this.vEnc) {
      this.vEnc = new VideoEncoder({
        output: (chunk, meta) => {
          if (meta && meta.decoderConfig && !this.vcfg) { this.vcfg = meta.decoderConfig; saveSession(); }
          const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
          const c = { k: 'v', t: chunk.type, ts: chunk.timestamp, du: chunk.duration || FRAME_US, d };
          this.v.push(c); keep(DB.add(c));
        },
        error: e => { $('msg').textContent = '映像エンコードのエラー：' + e.message; }
      });
      this.vEnc.configure(this.vConfig(this.vCodec));
      this.needKey = true;
    }
    if (audioStream && !this.aEnc) {
      this.aEnc = new AudioEncoder({
        output: (chunk, meta) => {
          if (meta && meta.decoderConfig && !this.acfg) { this.acfg = meta.decoderConfig; saveSession(); }
          const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
          const c = { k: 'a', t: chunk.type, ts: chunk.timestamp, du: chunk.duration || 0, d };
          this.a.push(c); keep(DB.add(c));
        },
        error: e => { $('msg').textContent = '音声エンコードのエラー：' + e.message; }
      });
      this.aEnc.configure(this.aConfig(this.aCodec));
    }
  },
  start() { this.v = []; this.a = []; this.vcfg = this.acfg = null; this.frameIndex = 0; this.nextFrameUs = 0; this.lastAudioEndUs = 0; this.resume(); },
  resume() {
    this.ensureEncoders();
    this.needKey = true;
    this.audioBaseUs = Math.max(elapsed * 1000, this.lastAudioEndUs);
    this.audioSamples = 0;
    this.nextFrameUs = Math.max(this.nextFrameUs, Math.ceil(elapsed * 1000 / FRAME_US) * FRAME_US);
  },
  pause() {
    if (this.vEnc && this.vEnc.state === 'configured') keep(this.vEnc.flush());
    if (this.aEnc && this.aEnc.state === 'configured') keep(this.aEnc.flush());
  },
  tick() { // 描画ごとに呼ばれ、25fps分のフレームをエンコード
    const nowUs = elapsed * 1000;
    let n = 0;
    while (this.nextFrameUs <= nowUs && n < 3) {
      if (this.vEnc.encodeQueueSize < 10) {
        const f = new VideoFrame(recCanvas, { timestamp: Math.round(this.nextFrameUs), duration: Math.round(FRAME_US) });
        this.vEnc.encode(f, { keyFrame: this.needKey || this.frameIndex % (FPS * 2) === 0 });
        f.close();
        this.needKey = false; this.frameIndex++;
      }
      this.nextFrameUs += FRAME_US; n++;
    }
    if (this.nextFrameUs <= nowUs) this.nextFrameUs = Math.ceil(nowUs / FRAME_US) * FRAME_US;
  },
  onAudio(buf) {
    if (!this.aEnc || this.aEnc.state !== 'configured') return;
    const sr = audioCtx.sampleRate;
    let ts = this.audioBaseUs + Math.round(this.audioSamples * 1e6 / sr);
    if (ts < this.lastAudioEndUs) ts = Math.round(this.lastAudioEndUs);
    const ad = new AudioData({ format: 'f32', sampleRate: sr, numberOfFrames: buf.length, numberOfChannels: 1, timestamp: ts, data: buf });
    this.aEnc.encode(ad); ad.close();
    this.audioSamples += buf.length;
    this.lastAudioEndUs = ts + buf.length * 1e6 / sr;
  },
  restore(rows, s) {
    this.vcfg = s.vcfg || null; this.acfg = s.acfg || null; this.aCodec = s.aCodec || this.aCodec;
    this.v = rows.filter(r => r.k === 'v');
    this.a = rows.filter(r => r.k === 'a');
    this.frameIndex = this.v.length;
    const lastV = this.v.reduce((m, c) => Math.max(m, c.ts + c.du), 0);
    this.nextFrameUs = Math.ceil(Math.max(lastV, elapsed * 1000) / FRAME_US) * FRAME_US;
    this.lastAudioEndUs = this.a.reduce((m, c) => Math.max(m, c.ts + c.du), 0);
    return this.v.length > 0;
  },
  async finish() {
    this.pause();
    await drain();
    try { this.vEnc && this.vEnc.close(); } catch (e) {}
    try { this.aEnc && this.aEnc.close(); } catch (e) {}
    this.vEnc = this.aEnc = null;

    const v = this.v.slice().sort((x, y) => x.ts - y.ts);
    while (v.length && v[0].t !== 'key') v.shift();
    if (!v.length || !this.vcfg) throw new Error('映像データがありません');
    const a = this.a.slice().sort((x, y) => x.ts - y.ts);
    const sr = audioCtx ? audioCtx.sampleRate : 48000;
    if (a.length && !this.acfg) this.acfg = this.aCodec === 'opus' ? { sampleRate: 48000 } : aacConfig(sr);
    let asc = this.acfg && this.acfg.description;
    if (this.aCodec !== 'opus' && !asc) asc = aacConfig((this.acfg && this.acfg.sampleRate) || sr).description;
    return MP4.build(
      { width: OUT, height: OUT, avcC: this.vcfg.description, samples: v },
      a.length ? { codec: this.aCodec, sampleRate: (this.acfg && this.acfg.sampleRate) || sr, channels: 1, description: asc, samples: a } : null
    );
  }
};

// ================= 互換エンジン（MediaRecorder） =================
// 高速エンジンが使えないブラウザ用。開き直した場合のみ、終了時に再生しながら1本にまとめます。
const MR = {
  rec: null, segments: [], mem: {},
  mime() {
    const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  },
  make(extraAudio) {
    const out = recCanvas.captureStream(FPS);
    (extraAudio || audioStream)?.getAudioTracks().forEach(t => out.addTrack(t));
    const mime = this.mime();
    const opt = { videoBitsPerSecond: V_BITRATE, audioBitsPerSecond: A_BITRATE };
    if (mime) opt.mimeType = mime;
    return new MediaRecorder(out, opt);
  },
  newSegment() {
    this.rec = this.make();
    const id = Date.now();
    this.segments.push({ id, mime: this.rec.mimeType || this.mime() || 'video/webm' });
    this.mem[id] = [];
    this.rec.ondataavailable = e => {
      if (!e.data.size) return;
      this.mem[id].push(e.data);
      keep(DB.add({ k: 'm', seg: id, data: e.data }));
      saveSession();
    };
    this.rec.start(1000);
  },
  start() { this.segments = []; this.mem = {}; this.newSegment(); },
  resume() {
    if (this.rec && this.rec.state === 'paused') this.rec.resume();
    else this.newSegment();
  },
  pause() {
    if (this.rec && this.rec.state === 'recording') { this.rec.requestData(); this.rec.pause(); }
  },
  tick() {},
  restore(rows, s) {
    this.segments = s.segments || []; this.mem = {};
    rows.filter(r => r.k === 'm').forEach(r => (this.mem[r.seg] = this.mem[r.seg] || []).push(r.data));
    this.segments = this.segments.filter(g => this.mem[g.id] && this.mem[g.id].length);
    return this.segments.length > 0;
  },
  async finish() {
    if (this.rec && this.rec.state !== 'inactive') {
      const stopped = new Promise(r => this.rec.addEventListener('stop', r, { once: true }));
      this.rec.stop(); await stopped;
    }
    this.rec = null;
    await drain();
    const parts = this.segments.map(g => new Blob(this.mem[g.id], { type: g.mime.split(';')[0] }));
    if (parts.length === 1) return parts[0];
    return this.merge(parts);
  },
  async merge(parts) {
    $('busyText').textContent = '動画をつないでいます…';
    const v = document.createElement('video');
    v.playsInline = true;
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    mergeVid = v;
    let dest = null;
    try {
      const src = audioCtx.createMediaElementSource(v);
      dest = audioCtx.createMediaStreamDestination();
      src.connect(dest);
    } catch (e) {}
    const rec = this.make(dest ? dest.stream : null);
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    let doneMs = 0;
    const tm = setInterval(() => {
      $('busyPct').textContent = Math.min(99, Math.round((doneMs + v.currentTime * 1000) / elapsed * 100)) + '%';
    }, 200);
    for (let i = 0; i < parts.length; i++) {
      const url = URL.createObjectURL(parts[i]);
      v.src = url;
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('読み込めない部分があります')); });
      try { await v.play(); } catch (e) { v.muted = true; await v.play(); }
      if (i === 0) rec.start(1000); else rec.resume();
      await new Promise(r => (v.onended = r));
      rec.pause();
      if (isFinite(v.duration)) doneMs += v.duration * 1000;
      URL.revokeObjectURL(url);
    }
    const stopped = new Promise(r => (rec.onstop = r));
    rec.stop(); await stopped;
    clearInterval(tm);
    v.remove(); mergeVid = null;
    return new Blob(chunks, { type: (rec.mimeType || 'video/webm').split(';')[0] });
  }
};
let mergeVid = null;
const E = () => engine === 'wc' ? WC : MR;

function aacConfig(sr) {
  const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000];
  let fi = rates.indexOf(sr); if (fi < 0) fi = 3;
  const ch = 1;
  const desc = new Uint8Array([(2 << 3) | (fi >> 1), ((fi & 1) << 7) | (ch << 3)]);
  return { codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: ch, description: desc };
}

// ================= 小さなMP4書き出し（外部ライブラリ不要） =================
// 映像(H.264)と音声(AAC または Opus)のデータを、そのまま MP4 の箱に詰めます。
const MP4 = (() => {
  const enc = new TextEncoder();
  const u8 = d => d instanceof Uint8Array ? d : d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength);
  const cat = parts => {
    const n = parts.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(n); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  };
  const u32 = v => new Uint8Array([(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255]);
  const u16 = v => new Uint8Array([(v >>> 8) & 255, v & 255]);
  const u8b = v => new Uint8Array([v & 255]);
  const zeros = n => new Uint8Array(n);
  const str = s => enc.encode(s);
  const box = (type, ...body) => { const b = cat(body.map(u8)); return cat([u32(b.length + 8), str(type), b]); };
  const full = (type, ver, flags, ...body) => box(type, u8b(ver), new Uint8Array([(flags >> 16) & 255, (flags >> 8) & 255, flags & 255]), ...body);
  const MATRIX = cat([u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000)]);

  // 記述子（esds用）
  const desc = (tag, body) => cat([u8b(tag), new Uint8Array([0x80, 0x80, 0x80, body.length]), body]);

  function stts(deltas) {
    const runs = [];
    for (const d of deltas) {
      if (runs.length && runs[runs.length - 1][1] === d) runs[runs.length - 1][0]++;
      else runs.push([1, d]);
    }
    return full('stts', 0, 0, u32(runs.length), ...runs.map(([c, d]) => cat([u32(c), u32(d)])));
  }

  // タイムスタンプ（µs）から、各サンプルの長さを時間単位で求める
  function ticks(samples, scale, lastDefault) {
    const pos = samples.map(s => Math.round((s.ts - samples[0].ts) * scale / 1e6));
    const d = [];
    for (let i = 0; i < samples.length; i++) {
      d.push(i + 1 < samples.length ? Math.max(1, pos[i + 1] - pos[i]) : Math.max(1, Math.round((samples[i].du || lastDefault) * scale / 1e6)));
    }
    return d;
  }

  function trak(id, t, offsets, movieScale) {
    const total = t.deltas.reduce((a, b) => a + b, 0);
    const movieDur = Math.round(total * movieScale / t.scale);
    const isV = t.kind === 'v';
    const tkhd = full('tkhd', 0, 3, u32(0), u32(0), u32(id), u32(0), u32(movieDur), zeros(8),
      u16(0), u16(0), u16(isV ? 0 : 0x0100), u16(0), MATRIX, u32((t.width || 0) << 16), u32((t.height || 0) << 16));
    const mdhd = full('mdhd', 0, 0, u32(0), u32(0), u32(t.scale), u32(total), u16(0x55c4), u16(0));
    const hdlr = full('hdlr', 0, 0, u32(0), str(isV ? 'vide' : 'soun'), zeros(12), str(isV ? 'VideoHandler\0' : 'SoundHandler\0'));
    const mhd = isV ? full('vmhd', 0, 1, zeros(8)) : full('smhd', 0, 0, zeros(4));
    const dinf = box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1)));
    const n = t.samples.length;
    const stbl = box('stbl',
      full('stsd', 0, 0, u32(1), t.entry),
      stts(t.deltas),
      ...(isV ? [full('stss', 0, 0, u32(t.keys.length), ...t.keys.map(u32))] : []),
      full('stsc', 0, 0, u32(1), u32(1), u32(1), u32(1)),
      full('stsz', 0, 0, u32(0), u32(n), ...t.samples.map(s => u32(s.d.length))),
      full('stco', 0, 0, u32(n), ...offsets.map(u32))
    );
    return box('trak', tkhd, box('mdia', mdhd, hdlr, box('minf', mhd, dinf, stbl)));
  }

  function videoEntry(w, h, avcC) {
    return box('avc1', zeros(6), u16(1), u16(0), u16(0), zeros(12), u16(w), u16(h),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1), zeros(32), u16(0x18), u16(0xffff),
      box('avcC', u8(avcC)));
  }
  function audioBase(type, ch, sr, extra) {
    return box(type, zeros(6), u16(1), zeros(8), u16(ch), u16(16), u16(0), u16(0), u32((sr & 0xffff) << 16), extra);
  }
  function aacEntry(ch, sr, asc) {
    const dcd = desc(4, cat([u8b(0x40), u8b(0x15), zeros(3), u32(0), u32(0), desc(5, u8(asc))]));
    const esd = desc(3, cat([u16(1), u8b(0), dcd, desc(6, u8b(2))]));
    return audioBase('mp4a', ch, sr, full('esds', 0, 0, esd));
  }
  function opusEntry(ch, preSkip, inputRate) {
    const dOps = box('dOps', u8b(0), u8b(ch), u16(preSkip), u32(inputRate), u16(0), u8b(0));
    return audioBase('Opus', ch, 48000, dOps);
  }

  // video: {width,height,avcC,samples[{d,t,ts,du}]}, audio: {codec,sampleRate,channels,description,samples} | null
  function build(video, audio) {
    const tracks = [];
    const vs = video.samples;
    tracks.push({
      kind: 'v', scale: 90000, samples: vs, width: video.width, height: video.height,
      deltas: ticks(vs, 90000, 40000),
      keys: vs.map((s, i) => s.t === 'key' ? i + 1 : 0).filter(Boolean),
      entry: videoEntry(video.width, video.height, video.avcC)
    });
    if (audio && audio.samples.length) {
      const opus = audio.codec === 'opus';
      const scale = opus ? 48000 : audio.sampleRate;
      let entry;
      if (opus) {
        let preSkip = 312;
        const d = audio.description ? u8(audio.description) : null;
        if (d && d.length >= 12 && String.fromCharCode(...d.slice(0, 8)) === 'OpusHead') preSkip = d[10] | (d[11] << 8);
        entry = opusEntry(audio.channels, preSkip, audio.sampleRate);
      } else {
        entry = aacEntry(audio.channels, audio.sampleRate, audio.description);
      }
      tracks.push({
        kind: 'a', scale, samples: audio.samples, entry,
        deltas: ticks(audio.samples, scale, (opus ? 960 : 1024) * 1e6 / scale)
      });
    }

    const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str('avc1'), str('mp41'));
    const movieScale = 1000;
    const makeMoov = offs => {
      const traks = tracks.map((t, i) => trak(i + 1, t, offs[i], movieScale));
      const dur = Math.max(...tracks.map(t => Math.round(t.deltas.reduce((a, b) => a + b, 0) * movieScale / t.scale)));
      const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(movieScale), u32(dur), u32(0x10000), u16(0x0100), zeros(10), MATRIX, zeros(24), u32(tracks.length + 1));
      return box('moov', mvhd, ...traks);
    };
    // 1回目で moov の大きさを測り、2回目で本当の位置を書き込む
    const dummy = tracks.map(t => t.samples.map(() => 0));
    const moovLen = makeMoov(dummy).length;
    let pos = ftyp.length + moovLen + 8;
    const offs = tracks.map(t => t.samples.map(s => { const o = pos; pos += s.d.length; return o; }));
    const moov = makeMoov(offs);
    const payload = [];
    tracks.forEach(t => t.samples.forEach(s => payload.push(u8(s.d))));
    const mdatLen = payload.reduce((a, p) => a + p.length, 0) + 8;
    return new Blob([ftyp, moov, u32(mdatLen), str('mdat'), ...payload], { type: 'video/mp4' });
  }
  return { build };
})();

// ================= 共通処理 =================
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load failed'));
    document.head.appendChild(s);
  });
}
const msg = t => { $('msg').textContent = t || ''; };

function saveSession() {
  if (state === 'idle' || state === 'done') return;
  keep(DB.set('session', {
    engine, elapsed, facing, zoom,
    segments: MR.segments, vcfg: WC.vcfg, acfg: WC.acfg, aCodec: WC.aCodec
  }));
}

// ---------- カメラ・マイク ----------
const videoC = () => ({ facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } });
const AUDIO_C = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

function micErrorText(e) {
  if (!e) return '';
  if (e.name === 'NotAllowedError' || e.name === 'SecurityError')
    return 'マイクが許可されていません。アドレスバーの鍵マーク（サイトの設定）からマイクを「許可」にして、ページを開き直してください。';
  if (e.name === 'NotFoundError') return 'マイクが見つかりませんでした。';
  if (e.name === 'NotReadableError') return 'マイクを使えませんでした。通話アプリなど、マイクを使っている他のアプリを閉じてください。';
  return 'マイクを使えませんでした：' + e.message;
}

// 最初はカメラとマイクを一度にお願いする（許可が1回で済み、スマホでも安定します）
async function initMedia() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: videoC(), audio: AUDIO_C });
    videoStream = new MediaStream(s.getVideoTracks());
    audioStream = new MediaStream(s.getAudioTracks());
    await attachVideo();
  } catch (e) {
    await startCamera();
    await startMic(true);
  }
}

async function attachVideo() {
  cam.srcObject = videoStream;
  await cam.play();
  drawMirror = (facing === 'user');
}

async function startCamera() {
  switching = true; $('btnSwitch').disabled = true;
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: videoC(), audio: false });
    await attachVideo();
  } catch (e) {
    msg('カメラを起動できませんでした：' + e.message + '（HTTPSで開いているか、許可を確認してください）');
  }
  switching = false; $('btnSwitch').disabled = false;
  // カメラを開き直したときにマイクが止められてしまう端末があるので確認
  if (audioStream && audioStream.getAudioTracks().every(t => t.readyState === 'ended')) await startMic(false);
}

async function startMic(showErr) {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: AUDIO_C });
    if (audioStream) audioStream.getTracks().forEach(t => t.stop());
    audioStream = s;
    connectMic();
    msg('');
  } catch (e) {
    audioStream = null;
    if (showErr) msg(micErrorText(e));
  }
  updateMicUI();
}

// マイク音声の通り道（レベル表示と、高速エンジンでの録音）
async function setupAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    try { audioCtx = new AC({ sampleRate: 48000 }); } catch (e) { audioCtx = new AC(); }
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
    sink = audioCtx.createGain(); sink.gain.value = 0; // スピーカーには出さない
    analyser.connect(sink); sink.connect(audioCtx.destination);
    if (audioCtx.audioWorklet) {
      const code = `class C extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0}
        process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];
        if(this.n===2048){this.port.postMessage(this.b,[this.b.buffer]);this.b=new Float32Array(2048);this.n=0}}}return true}}
        registerProcessor('cap',C);`;
      const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
      await audioCtx.audioWorklet.addModule(url);
      capNode = new AudioWorkletNode(audioCtx, 'cap');
      capNode.connect(sink);
      capNode.port.onmessage = e => { if (state === 'recording' && engine === 'wc') WC.onAudio(e.data); };
    }
  } catch (e) { capNode = null; }
  connectMic();
}

function connectMic() {
  if (!audioCtx || !audioStream) return;
  try { if (micSrc) micSrc.disconnect(); } catch (e) {}
  micSrc = audioCtx.createMediaStreamSource(audioStream);
  micSrc.connect(analyser);
  if (capNode) micSrc.connect(capNode);
  audioStream.getAudioTracks().forEach(t => { t.onended = () => { audioStream = null; updateMicUI(); msg('マイクが止まりました。マイクのボタンを押すと再接続します。'); }; });
}

// ブラウザは「画面を触ったあと」でないと音声処理を始めないので、触るたびに起こす
const wakeAudio = () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); };
document.addEventListener('pointerdown', wakeAudio, true);
document.addEventListener('touchend', wakeAudio, true);

function updateMicUI() {
  const on = !!audioStream;
  $('micBtn').classList.toggle('off', !on);
  $('micSlash').classList.toggle('hidden', on);
  $('micText').classList.toggle('hidden', on);
}

async function micButton() {
  if (audioStream) {
    wakeAudio();
    msg(audioCtx && audioCtx.state === 'running' ? 'マイクは使えています。' : 'マイクを準備しています…');
    return;
  }
  if (state !== 'idle') { msg('マイクは録画を始める前にオンにしてください。'); return; }
  await startMic(true);
  if (audioStream) engine = (await WC.supported()) ? 'wc' : 'mr'; // マイク込みで方式を選び直す
}

const levelBuf = new Float32Array(512);
function updateLevel() {
  if (!analyser || !audioStream) { $('micLevel').style.width = '0'; return; }
  analyser.getFloatTimeDomainData(levelBuf);
  let sum = 0; for (let i = 0; i < levelBuf.length; i++) sum += levelBuf[i] * levelBuf[i];
  const rms = Math.sqrt(sum / levelBuf.length);
  $('micLevel').style.width = Math.min(100, rms * 400) + '%';
}

function switchCamera() {
  if (switching || state === 'done' || state === 'finishing') return;
  facing = facing === 'user' ? 'environment' : 'user';
  saveSession();
  startCamera();
}

// ---------- ズーム ----------
function setZoom(z) {
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  $('zoomLabel').textContent = zoom.toFixed(1) + 'x';
}
const stage = $('stage');
let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && state !== 'done') pinch = { d: dist(e.touches), z: zoom };
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) { e.preventDefault(); setZoom(pinch.z * dist(e.touches) / pinch.d); }
}, { passive: false });
stage.addEventListener('touchend', e => { if (e.touches.length < 2) { if (pinch) saveSession(); pinch = null; } });
stage.addEventListener('wheel', e => { if (state === 'done') return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault()); // iPhoneのページ拡大を防ぐ
$('zoomIn').onclick = () => { setZoom(Math.round((zoom + 0.5) * 2) / 2); saveSession(); };
$('zoomOut').onclick = () => { setZoom(Math.round((zoom - 0.5) * 2) / 2); saveSession(); };
$('zoomLabel').onclick = () => { setZoom(1); saveSession(); };

// ---------- 描画ループ ----------
function draw(now) {
  if (mergeVid) {
    if (mergeVid.videoWidth) {
      rctx.drawImage(mergeVid, 0, 0, OUT, OUT);
      ctx.drawImage(mergeVid, 0, 0, canvas.width, canvas.height);
    }
  } else if (!switching && cam.videoWidth && cam.videoHeight) {
    const vw = cam.videoWidth, vh = cam.videoHeight;
    const s = Math.min(vw, vh) / zoom; // ズームは中央を小さく切り抜く
    ctx.save();
    if (drawMirror) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(cam, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    rctx.drawImage(canvas, 0, 0, OUT, OUT);
  }
  if (state === 'recording') {
    elapsed = Math.min(MAX_MS, elapsed + (now - lastTick));
    E().tick();
    if (elapsed >= MAX_MS) reachMax();
  }
  lastTick = now;
  updateTimer();
  updateLevel();
  requestAnimationFrame(draw);
}

const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function updateTimer() {
  const remain = MAX_MS - elapsed;
  $('time').textContent = fmt(elapsed);
  $('remain').textContent = '残り ' + fmt(Math.ceil(remain / 1000) * 1000);
  $('remain').classList.toggle('low', remain <= 10000 && state !== 'idle');
  $('progress').style.width = (elapsed / MAX_MS * 100) + '%';
}
function showNotice(t) { $('notice').textContent = t; $('notice').classList.toggle('hidden', !t); }

// ---------- 録画操作 ----------
async function startRecording() {
  if (!videoStream || !ready) return;
  wakeAudio();
  try { await DB.clear(); } catch (e) {}
  elapsed = 0;
  state = 'recording';
  E().start();
  lastTick = performance.now();
  showNotice(''); msg(audioStream ? '' : '音声なしで録画しています（マイクがオフです）');
  setState('recording');
  saveSession();
}

function pause() {
  if (state !== 'recording') return;
  E().pause();
  setState('paused');
  saveSession();
}

function resume() {
  if (state !== 'paused') return;
  wakeAudio();
  E().resume();
  lastTick = performance.now(); // 止めていた時間は数えない
  showNotice('');
  setState('recording');
}

function shutter() {
  if (state === 'idle') startRecording();
  else if (state === 'recording') pause();
  else if (state === 'paused') resume();
}

function askStop() {
  resumeAfterBack = (state === 'recording');
  pause();
  $('sheetTitle').textContent = '録画を終了しますか？';
  $('sheetText').textContent = '終了すると動画が完成し、続きは撮れなくなります。';
  $('btnBack').classList.remove('hidden');
  $('sheet').classList.remove('hidden');
}
function reachMax() {
  pause();
  resumeAfterBack = false;
  $('sheetTitle').textContent = '最大時間（1:30）に達しました';
  $('sheetText').textContent = '「終了する」を押すと動画が完成します。';
  $('btnBack').classList.add('hidden');
  $('sheet').classList.remove('hidden');
}
function back() {
  $('sheet').classList.add('hidden');
  if (resumeAfterBack) resume();
}

async function finalize() {
  $('sheet').classList.add('hidden');
  wakeAudio();
  setState('finishing');
  $('busyText').textContent = '動画を仕上げています…'; $('busyPct').textContent = '';
  $('busy').classList.remove('hidden');
  let blob = null;
  try { blob = await E().finish(); }
  catch (e) { msg('仕上げに失敗しました：' + e.message); }
  $('busy').classList.add('hidden');
  if (!blob) { setState('paused'); return; }
  try { await DB.clear(); await DB.set('final', { blob }); } catch (e) {}
  showResult(blob);
}

function showResult(blob) {
  videoBlob = blob;
  fileExt = (blob.type || '').includes('mp4') ? 'mp4' : 'webm';
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  playback.src = blobUrl;
  playback.style.display = 'block';
  canvas.style.display = 'none';
  setState('done');
  const canShare = navigator.canShare && navigator.canShare({ files: [makeFile()] });
  $('btnShare').classList.toggle('hidden', !canShare);
}

function makeFile() {
  const name = 'video_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + fileExt;
  return new File([videoBlob], name, { type: videoBlob.type || 'video/' + fileExt });
}
async function share() {
  try { await navigator.share({ files: [makeFile()] }); }
  catch (e) { if (e.name !== 'AbortError') { msg('共有できなかったので、ダウンロードします。'); download(); } }
}
function download() {
  const a = document.createElement('a');
  a.href = blobUrl; a.download = makeFile().name;
  document.body.appendChild(a); a.click(); a.remove();
}

async function retake() {
  try { await DB.clear(); } catch (e) {}
  playback.pause(); playback.removeAttribute('src');
  playback.style.display = 'none'; canvas.style.display = 'block';
  elapsed = 0; setZoom(1);
  msg(''); showNotice('');
  setState('idle');
}

// ---------- 開き直したときの復元 ----------
async function restore() {
  try {
    const final = await DB.get('final');
    if (final && final.blob) { showResult(final.blob); return; }
    const s = await DB.get('session');
    if (!s || !s.elapsed) return;
    if (s.engine === 'wc' && engine !== 'wc') return; // この環境では続きを作れない
    engine = s.engine || engine;
    elapsed = s.elapsed; facing = s.facing || facing; setZoom(s.zoom || 1);
    const rows = await DB.all();
    if (!E().restore(rows, s)) { elapsed = 0; return; }
    setState('paused');
    showNotice('前回の続きから撮影できます。シャッターを押すと再開します');
  } catch (e) {
    msg('このブラウザでは途中保存が使えないため、閉じると録画が消えます。');
  }
}

// ---------- 画面の状態 ----------
const HINTS = { idle: 'タップで録画', recording: 'タップで一時停止', paused: 'タップで再開' };
function setState(s) {
  state = s;
  const active = (s === 'recording' || s === 'paused');
  $('badge').classList.toggle('rec', s === 'recording');
  $('badge').classList.toggle('paused', s === 'paused');
  $('shutter').dataset.s = s;
  $('shutter').setAttribute('aria-label', HINTS[s] || '');
  $('hint').textContent = HINTS[s] || '';
  $('controls').classList.toggle('hidden', s === 'done' || s === 'finishing');
  $('doneRow').classList.toggle('hidden', s !== 'done');
  $('btnStop').classList.toggle('invisible', !active);
  $('btnRetake').classList.toggle('hidden', s !== 'done');
  $('micBtn').classList.toggle('hidden', s === 'done');
  $('zoomBox').classList.toggle('hidden', s === 'done' || s === 'finishing');
}

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('pagehide', pause);

$('shutter').onclick = shutter;
$('btnStop').onclick = askStop;
$('btnBack').onclick = back;
$('btnConfirm').onclick = finalize;
$('btnShare').onclick = share;
$('btnSave').onclick = download;
$('btnRetake').onclick = retake;
$('btnSwitch').onclick = switchCamera;
$('micBtn').onclick = micButton;

(async () => {
  await initMedia();
  await setupAudio();
  updateMicUI();
  engine = (await WC.supported()) ? 'wc' : 'mr';
  const f0 = facing;
  await restore();
  if (facing !== f0) await startCamera(); // 前回のカメラ向きに合わせる
  ready = true;
  $('shutter').disabled = false;
  if (state === 'idle') $('hint').textContent = HINTS.idle;
})();
requestAnimationFrame(t => { lastTick = t; draw(t); });
}
</script>
